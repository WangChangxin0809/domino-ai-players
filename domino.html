  // ============================================================================
  // 获取人类玩家索引的辅助函数（-1 表示无人类玩家）
  function _humanIdx(stateObj) {
    if (!stateObj) return 0;
    if (stateObj.humanPlayerIndex !== undefined && stateObj.humanPlayerIndex !== null) {
      return stateObj.humanPlayerIndex;
    }
    return 0;
  }

  function setupEventListeners() {
    // 手牌点击（事件委托）
    var handTiles = $("hand-tiles");
    if (handTiles) {
      handTiles.addEventListener("click", function(e) {
        var tileEl = e.target.closest(".tile");
        if (!tileEl) return;
        var stateObj = getState();
        if (!stateObj) return;
        var hi = _humanIdx(stateObj);
        if (stateObj.currentPlayerIndex !== hi) return;
        if (stateObj.phase !== "waiting_human") return;

        var tileIndex = parseInt(tileEl.getAttribute("data-tile-index"), 10);
        if (isNaN(tileIndex)) return;

        if (stateObj.selectedTileIndex === tileIndex) {
          stateObj.selectedTileIndex = null;
        } else {
          stateObj.selectedTileIndex = tileIndex;
        }
        renderAll();
      });
    }

    // 火车行点击（事件委托）
    var trainsContainer = $("trains-container");
    if (trainsContainer) {
      trainsContainer.addEventListener("click", function(e) {
        var trainRow = e.target.closest(".train-row.highlight");
        if (!trainRow) return;
        var stateObj = getState();
        if (!stateObj) return;
        var hi = _humanIdx(stateObj);
        if (stateObj.currentPlayerIndex !== hi) return;
        if (stateObj.phase !== "waiting_human") return;
        if (stateObj.selectedTileIndex === null) return;

        var trainId = trainRow.getAttribute("data-train-id");
        if (!trainId) return;

        var result = DominoEngine.executePlay(stateObj, hi, stateObj.selectedTileIndex, trainId);
        stateObj.selectedTileIndex = null;

        if (result) {
          var tile = result.tile;
          var tileStr = tile[0] + "|" + tile[1];
          var trainName = getTrainDisplayName(trainId, stateObj);
          addEvent(stateObj, hi, "play", "你 出了 [" + tileStr + "] → " + trainName);
        }

        renderAll();
        // 教练模式：显示提示
        if (stateObj.gameMode === "coach" && result) {
          showCoachTip(stateObj, hi);
        }
        setTimeout(function() { DominoEngine.advanceTurn(stateObj); processNextTurn(); }, 300);
      });
    }

    // 摸牌按钮
    var btnDraw = $("btn-draw");
    if (btnDraw) {
      btnDraw.addEventListener("click", function() {
        var stateObj = getState();
        if (!stateObj) return;
        var hi = _humanIdx(stateObj);
        if (stateObj.currentPlayerIndex !== hi) return;

        var result = DominoEngine.executeDraw(stateObj, hi);

        if (result) {
          var tile = result.tile;
          var tileStr = tile[0] + "|" + tile[1];
          addEvent(stateObj, hi, "draw", "你 摸了 [" + tileStr + "]");

          if (result.played) {
            var trainName = getTrainDisplayName(result.trainId, stateObj);
            addEvent(stateObj, hi, "play",
              "你 打出摸到的牌 [" + tileStr + "] → " + trainName);
          } else {
            var legalMoves2 = DominoEngine.getLegalMoves(stateObj, hi);
            if (!legalMoves2 || legalMoves2.length === 0) {
              stateObj.phase = "waiting_human_drew_no_play";
            }
          }
        } else {
          DominoEngine.executePass(stateObj, hi);
          addEvent(stateObj, hi, "pass", "你 跳过回合（牌堆已空），火车开放");
        }

        renderAll();
        if (stateObj.gameMode === "coach") {
          showCoachTip(stateObj, hi);
        }
        setTimeout(function() { DominoEngine.advanceTurn(stateObj); processNextTurn(); }, 300);
      });
    }

    // 跳过按钮
    var btnPass = $("btn-pass");
    if (btnPass) {
      btnPass.addEventListener("click", function() {
        var stateObj = getState();
        if (!stateObj) return;
        var hi = _humanIdx(stateObj);
        if (stateObj.currentPlayerIndex !== hi) return;

        DominoEngine.executePass(stateObj, hi);
        addEvent(stateObj, hi, "pass", "你 跳过回合，火车开放");

        renderAll();
        setTimeout(function() { DominoEngine.advanceTurn(stateObj); processNextTurn(); }, 300);
      });
    }

    // 覆盖层按钮（动态绑定，点击时处理）
    var overlay = $("overlay");
    if (overlay) {
      overlay.addEventListener("click", function(e) {
        var btn = e.target.closest("#overlay-btn, .overlay-btn");
        if (!btn) return;
        var action = btn.getAttribute("data-action");
        if (action === "new_game") {
          handleNewGame();
        } else if (action === "next_round") {
          handleNextRound();
        } else if (action === "back_to_menu") {
          handleBackToMenu();
        }
      });
    }

    // 返回菜单按钮
    var backBtn = $("back-to-menu-btn");
    if (backBtn) {
      backBtn.addEventListener("click", function() {
        handleBackToMenu();
      });
    }
  }

  // ============================================================================
  // 菜单事件监听
  // ============================================================================
  function setupMenuListeners() {
    // 菜单卡片点击
    var cards = document.querySelectorAll(".menu-card");
    for (var c = 0; c < cards.length; c++) {
      (function(card) {
        card.addEventListener("click", function() {
          var mode = card.getAttribute("data-mode");
          if (mode) startGame(mode);
        });
      })(cards[c]);
    }

    // 规则按钮
    var rulesBtn = $("menu-rules-btn");
    if (rulesBtn) {
      rulesBtn.addEventListener("click", showRules);
    }

    // 规则关闭按钮
    var rulesClose = $("rules-close-btn");
    if (rulesClose) {
      rulesClose.addEventListener("click", hideRules);
    }

    // 点击规则覆盖层背景关闭
    var rulesOverlay = $("rules-overlay");
    if (rulesOverlay) {
      rulesOverlay.addEventListener("click", function(e) {
        if (e.target === rulesOverlay) hideRules();
      });
    }
  }

  // ============================================================================
  // 状态获取
  // ============================================================================
  function getState() {
    return (typeof DominoApp !== "undefined" && DominoApp.state) ? DominoApp.state : null;
  }

  // ============================================================================
  // 核心渲染函数
  // ============================================================================

  function renderAll() {
    renderScores();
    renderBoard();
    renderHand();
    renderAICards();
    renderEventLog();
    updateActionButtons();
  }

  // ============================================================================
  // 分数面板
  // ============================================================================
  function renderScores() {
    var panel = $("score-panel");
    if (!panel) return;
    var stateObj = getState();
    if (!stateObj) return;

    var players = stateObj.players;
    var html = "";

    for (var i = 0; i < players.length; i++) {
      var p = players[i];
      var isActive = (stateObj.currentPlayerIndex === i);
      var cardClass = "score-card" + (isActive ? " active" : "");
      var nameColor = "color:" + getPlayerColor(i) + ";";

      // 本轮惩罚：计算手牌点数和
      var roundPenalty = 0;
      if (p.hand && p.hand.length > 0) {
        for (var h = 0; h < p.hand.length; h++) {
          roundPenalty += DominoState.pips(p.hand[h]);
        }
      }

      var totalScore = p.totalScore || 0;

      // 找出当前领先（分数最低的）玩家
      var minScore = Infinity;
      for (var j = 0; j < players.length; j++) {
        if ((players[j].totalScore || 0) < minScore) {
          minScore = (players[j].totalScore || 0);
        }
      }
      var isLeading = (totalScore === minScore && players.length > 1);

      var totalClass = "score-card-total" + (isLeading ? " leading" : "");

      html += '<div class="' + cardClass + '">';
      html += '  <div class="score-card-header">';
      html += '    <span class="score-card-emoji">' + p.emoji + '</span>';
      html += '    <span class="score-card-name" style="' + nameColor + '">' + p.name + '</span>';
      if (p.personality && p.personality !== "human") {
        var persName = getPersonalityLabel(p.personality);
        html += '    <span class="score-card-badge">' + persName + '</span>';
      }
      html += '  </div>';
      html += '  <div class="score-card-round">本轮: ' + roundPenalty + '分</div>';
      html += '  <div class="' + totalClass + '">累计: ' + totalScore + '分</div>';
      html += '</div>';
    }

    panel.innerHTML = html;
  }

  function getPersonalityLabel(personality) {
    if (personality === "conservative") return "保守型";
    if (personality === "aggressive") return "冒险型";
    if (personality === "emotional") return "情绪型";
    if (personality === "coach") return "教练型";
    return personality;
  }

  // ============================================================================
  // 棋盘渲染
  // ============================================================================
  function renderBoard() {
    var stateObj = getState();
    if (!stateObj) return;

    // 引擎显示
    var engineDisplay = $("engine-display");
    if (engineDisplay) {
      engineDisplay.innerHTML = '<span class="engine-badge">&#x1F004; 引擎: ' +
        (stateObj.engineValue !== null ? stateObj.engineValue : "—") + '</span>';
    }

    // 火车容器
    var container = $("trains-container");
    if (!container) return;

    // 计算哪些火车对当前选中牌是合法的
    var legalTrainIds = {};
    if (stateObj.selectedTileIndex !== null && stateObj.legalMoves) {
      var moves = stateObj.legalMoves;
      for (var m = 0; m < moves.length; m++) {
        if (moves[m].tileIndex === stateObj.selectedTileIndex) {
          legalTrainIds[moves[m].trainId] = true;
        }
      }
    }

    // 渲染顺序：墨西哥火车优先，然后个人火车按玩家顺序（动态）
    var trainOrder = ["mexican"];
    for (var pi = 0; pi < stateObj.players.length; pi++) {
      trainOrder.push("p" + pi);
    }
    var html = "";

    for (var t = 0; t < trainOrder.length; t++) {
      var tid = trainOrder[t];
      var train = null;
      for (var tr = 0; tr < stateObj.trains.length; tr++) {
        if (stateObj.trains[tr].id === tid) {
          train = stateObj.trains[tr];
          break;
        }
      }
      if (!train) continue;

      var isHighlighted = (tid in legalTrainIds);
      var rowClass = "train-row" + (isHighlighted ? " highlight" : "");
      var displayName = getTrainDisplayName(tid, stateObj);

      html += '<div class="' + rowClass + '" data-train-id="' + tid + '">';

      // 标签
      var labelColor = getTrainLabelColor(tid, stateObj);
      html += '<span class="train-label" style="background:' + labelColor + ';">' + displayName + '</span>';

      // 徽章
      if (train.isPublic) {
        html += '<span class="train-badge" style="background:rgba(255,255,255,0.12);">&#x1F513; 开放</span>';
      }

      // 未满足双牌警告
      if (train.hasUnsatisfiedDouble && train.unsatisfiedDoubleValue !== null) {
        html += '<span class="train-badge" style="background:rgba(255,100,100,0.2);color:#ff6b6b;">&#x26A0;&#xFE0F; 需满足双' + train.unsatisfiedDoubleValue + '</span>';
      }

      // 开放标记（人类玩家自己的火车当不能出牌时）
      var humanTrainId = "p" + _humanIdx(stateObj);
      if (tid === humanTrainId && stateObj.currentPlayerIndex === _humanIdx(stateObj) &&
          stateObj.phase === "waiting_human_drew_no_play") {
        // 人类跳过，自己的火车开放
      }
      if (tid === humanTrainId && train.isPublic && stateObj.currentPlayerIndex !== _humanIdx(stateObj)) {
        html += '<span class="train-badge" style="background:rgba(102,187,106,0.2);color:#66bb6a;">&#x1F513; 开放</span>';
      }

      // 牌
      html += '<span class="train-tiles">';
      for (var ti = 0; ti < train.tiles.length; ti++) {
        html += renderTileHTML(train.tiles[ti], "small");
      }
      html += '</span>';

      // 开放端标记
      if (train.openValue !== null) {
        var openColor = getTrainOpenColor(tid, stateObj);
        html += '<span class="train-open" style="background:' + openColor + ';">' + train.openValue + '</span>';
      }

      html += '</div>';
    }

    container.innerHTML = html;
  }

  function getTrainLabelColor(trainId, stateObj) {
    if (trainId === "mexican") return "#e2b04a";
    var idx = parseInt(trainId.charAt(1), 10);
    if (isNaN(idx)) return "#555";
    return getPlayerColor(idx);
  }

  function getTrainOpenColor(trainId, stateObj) {
    if (trainId === "mexican") return "#c49a30";
    var idx = parseInt(trainId.charAt(1), 10);
    if (isNaN(idx)) return "#555";
    return getPlayerColor(idx);
  }

  // ============================================================================
  // 手牌渲染
  // ============================================================================
  function renderHand() {
    var handTiles = $("hand-tiles");
    if (!handTiles) return;
    var stateObj = getState();
    if (!stateObj) return;

    // 获取人类玩家的手牌
    var hi = _humanIdx(stateObj);
    if (hi < 0 || hi >= stateObj.players.length) {
      // 无人类玩家（旁观模式等），隐藏手牌区域
      var handArea = $("hand-area");
      if (handArea) handArea.style.display = "none";
      handTiles.innerHTML = "";
      return;
    }
    var handArea2 = $("hand-area");
    if (handArea2) handArea2.style.display = "";
    var humanPlayer = stateObj.players[hi];
    if (!humanPlayer || !humanPlayer.hand) {
      handTiles.innerHTML = "";
      return;
    }

    var hand = humanPlayer.hand;

    // 获取合法出牌（用于标记哪些牌可以打出）
    var legalTileIndices = {};
    if (stateObj.legalMoves) {
      var moves = stateObj.legalMoves;
      for (var m = 0; m < moves.length; m++) {
        legalTileIndices[moves[m].tileIndex] = true;
      }
    }

    var html = "";
    for (var i = 0; i < hand.length; i++) {
      var tile = hand[i];
      var classes = "tile";
      if (stateObj.selectedTileIndex === i) {
        classes += " tile-selected";
      }
      if (i in legalTileIndices) {
        classes += " tile-legal";
      }
      if (DominoState.isDouble(tile)) {
        classes += " tile-double";
      }
      html += '<div class="' + classes + '" data-tile-index="' + i + '">' +
        tile[0] + '│' + tile[1] + '</div>';
    }

    handTiles.innerHTML = html;
  }

  function renderTileHTML(tile, size) {
    var classes = "tile";
    if (size === "small") classes += " small";
    if (DominoState.isDouble(tile)) classes += " tile-double";
    return '<div class="' + classes + '">' + tile[0] + '│' + tile[1] + '</div>';
  }

  function renderTileElement(tile, size) {
    var el = document.createElement("div");
    el.className = "tile" + (size === "small" ? " small" : "");
    if (DominoState.isDouble(tile)) {
      el.className += " tile-double";
    }
    el.textContent = tile[0] + "│" + tile[1];
    return el;
  }

  // ============================================================================
  // AI 状态卡
  // ============================================================================
  function renderAICards() {
    var container = $("ai-cards");
    if (!container) return;
    var stateObj = getState();
    if (!stateObj) return;

    var html = "";
    var hi = _humanIdx(stateObj);
    for (var i = 0; i < stateObj.players.length; i++) {
      if (i === hi) continue; // 跳过人类玩家
      var player = stateObj.players[i];
      if (!player) continue;
      if (player.type !== "ai" && player.type !== "spectator") continue;

      var aiState = stateObj.aiStates ? stateObj.aiStates[i] : null;
      var isThinking = (stateObj.phase === "ai_thinking" && stateObj.currentPlayerIndex === i);
      var cardClass = "ai-card" + (isThinking ? " thinking" : "");
      var color = getPlayerColor(i);

      html += '<div class="' + cardClass + '">';

      // 顶部：emoji + 名字 + 个性标签
      html += '<div class="ai-card-top">';
      html += '<span class="ai-card-emoji">' + player.emoji + '</span>';
      html += '<div>';
      html += '<div class="ai-card-name" style="color:' + color + ';">' + player.name + '</div>';
      html += '<span class="ai-card-badge" style="background:' + color + '33;color:' + color + ';">' +
        getPersonalityLabel(player.personality) + '</span>';
      html += '</div>';
      html += '</div>';

      // 情绪 emoji（仅情绪型 AI 显示）
      if (player.personality === "emotional" && aiState) {
        var moodEmoji = DominoConfig.getMoodEmoji(aiState.mood);
        html += '<div style="margin-bottom:2px;">';
        html += '<span class="ai-card-mood">' + moodEmoji + '</span>';
        html += '</div>';
      }

      // 手牌数
      html += '<div class="ai-card-hand">&#x1F0CF; ×' + (player.hand ? player.hand.length : 0) + '</div>';

      // 思考中 / 消息
      if (isThinking) {
        html += '<div class="ai-card-thinking-text">思考中...</div>';
      } else if (player.latestMessage) {
        html += '<div class="ai-card-msg">' + escapeHTML(player.latestMessage) + '</div>';
      }

      html += '</div>';
    }

    container.innerHTML = html;
  }

  // ============================================================================
  // 事件日志
  // ============================================================================
  function renderEventLog() {
    var logEl = $("event-log");
    if (!logEl) return;
    var stateObj = getState();
    if (!stateObj) return;

    var log = stateObj.eventLog || [];
    var html = "";

    // 只显示最近 MAX_EVENT_LOG_ENTRIES 条
    var start = Math.max(0, log.length - MAX_EVENT_LOG_ENTRIES);
    for (var i = start; i < log.length; i++) {
      html += renderEventEntryHTML(log[i]);
    }

    logEl.innerHTML = html;

    // 自动滚动到底部
    logEl.scrollTop = logEl.scrollHeight;
  }

  function renderEventEntryHTML(entry) {
    var cls = "event-entry";
    var msg = escapeHTML(entry.message || "");

    if (entry.type === "round_end") {
      cls += " event-round-break";
    } else if (entry.type === "game_over") {
      cls += " event-gameover";
    } else if (entry.type === "system") {
      cls += " event-system";
    }

    if (entry.playerIndex !== undefined && entry.playerIndex !== null && entry.type !== "round_end" && entry.type !== "game_over") {
      var emoji = getPlayerEmoji(entry.playerIndex);
      var color = getPlayerColor(entry.playerIndex);
      msg = '<span style="color:' + color + ';">' + emoji + ' ' + msg + '</span>';
    }

    return '<div class="' + cls + '">' + msg + '</div>';
  }

  function addEvent(stateObj, playerIndex, type, message) {
    if (!stateObj) return;
    if (!stateObj.eventLog) {
      stateObj.eventLog = [];
    }
    stateObj.eventLog.push({
      round: stateObj.roundNumber || 1,
      playerIndex: playerIndex,
      type: type,
      message: message
    });

    // 裁剪旧条目
    if (stateObj.eventLog.length > MAX_EVENT_LOG_ENTRIES) {
      stateObj.eventLog = stateObj.eventLog.slice(stateObj.eventLog.length - MAX_EVENT_LOG_ENTRIES);
    }

    renderEventLog();
  }

  // ============================================================================
  // 动作按钮
  // ============================================================================
  function updateActionButtons() {
    var stateObj = getState();
    var btnDraw = $("btn-draw");
    var btnPass = $("btn-pass");

    if (!btnDraw || !btnPass) return;

    // 默认隐藏
    btnDraw.classList.add("hidden");
    btnPass.classList.add("hidden");

    if (!stateObj) return;

    // 只有人类玩家回合才显示按钮
    if (stateObj.currentPlayerIndex !== _humanIdx(stateObj)) return;

    if (stateObj.phase === "waiting_human_drew_no_play") {
      // 摸牌后没有可出的牌，显示 pass
      btnPass.classList.remove("hidden");
    } else if (stateObj.phase === "waiting_human") {
      // 人类回合，检查是否有合法出牌
      var legalMoves = stateObj.legalMoves;
      if (!legalMoves || legalMoves.length === 0) {
        // 没有合法出牌，显示摸牌按钮
        btnDraw.classList.remove("hidden");
      }
      // 如果有合法出牌，不显示任何按钮（用户通过点击tile/train出牌）
    }
  }

  // ============================================================================
  // 高亮合法火车
  // ============================================================================
  function highlightLegalTrains(stateObj) {
    // 这个方法的效果已集成在 renderBoard() 中
    // 通过检查 stateObj.selectedTileIndex 和 stateObj.legalMoves 决定高亮
    // 这里提供独立调用以便需要时刷新
    if (!stateObj) stateObj = getState();
    if (!stateObj) return;
    renderBoard();
  }

  // ============================================================================
  // 游戏主循环
  // ============================================================================
  function processNextTurn() {
    var stateObj = getState();
    if (!stateObj) return;

    // 检查游戏是否已结束
    if (stateObj.gameOver) return;

    // 检查当前轮是否结束
    if (DominoEngine.isRoundOver(stateObj)) {
      DominoEngine.scoreRound(stateObj);
      renderAll();

      var roundPenalties = [];
      for (var rp = 0; rp < stateObj.players.length; rp++) {
        var pp = stateObj.players[rp];
        var penalty = 0;
        if (pp.hand && pp.hand.length > 0) {
          for (var ph = 0; ph < pp.hand.length; ph++) {
            penalty += DominoState.pips(pp.hand[ph]);
          }
        }
        roundPenalties.push(pp.emoji + " " + pp.name + ": +" + penalty + "分");
      }
      addEvent(stateObj, null, "round_end",
        "━━ 第" + stateObj.roundNumber + "轮结束 ━━ " + roundPenalties.join(" | "));

      if (DominoEngine.isGameOver(stateObj)) {
        var winner = DominoEngine.getWinner(stateObj);
        if (winner) {
          addEvent(stateObj, null, "game_over",
            "&#x1F3C6; 游戏结束！胜者: " + winner.emoji + " " + winner.name);
        }
        showGameOver(stateObj);
        return;
      } else {
        showRoundSummary(stateObj);
        return;
      }
    }

    // 检查当前玩家是否已出完所有牌
    var currentPlayer = stateObj.players[stateObj.currentPlayerIndex];
    if (currentPlayer && currentPlayer.hand && currentPlayer.hand.length === 0) {
      DominoEngine.advanceTurn(stateObj);
      setTimeout(function() { processNextTurn(); }, 200);
      return;
    }

    var currentPlayerIndex = stateObj.currentPlayerIndex;
    var humanIdx = (stateObj.humanPlayerIndex !== undefined && stateObj.humanPlayerIndex !== null) ? stateObj.humanPlayerIndex : 0;

    if (currentPlayerIndex === humanIdx && stateObj.gameMode !== "spectator") {
      // 人类玩家回合
      stateObj.phase = "waiting_human";
      stateObj.legalMoves = DominoEngine.getLegalMoves(stateObj, humanIdx);
      renderAll();
      return; // 等待用户输入
    } else {
      // AI 回合（或旁观模式所有回合）
      stateObj.phase = "ai_thinking";
      renderAll();

      var delay = DominoAI.getThinkingDelay(stateObj, currentPlayerIndex);
      // 旁观模式缩短延迟
      if (stateObj.gameMode === "spectator") {
        delay = 500 + Math.random() * 600;
      }
      var aiIndex = currentPlayerIndex;
      setTimeout(function() {
        processAITurn(stateObj, aiIndex);
      }, delay);
    }
  }

  // ============================================================================
  // AI 回合处理
  // ============================================================================
  function processAITurn(stateObj, playerIndex) {
    if (!stateObj) return;

    var player = stateObj.players[playerIndex];
    if (!player) return;

    var isCoachMode = (stateObj.gameMode === "coach");
    var isSpectatorMode = (stateObj.gameMode === "spectator");

    // 教练模式使用推理版AI
    var move;
    if (isCoachMode && player.personality === "coach") {
      move = DominoAI.selectMoveWithReasoning(stateObj, playerIndex);
    } else {
      move = DominoAI.selectMove(stateObj, playerIndex);
    }

    if (move) {
      // AI 出牌
      var result = DominoEngine.executePlay(stateObj, playerIndex, move.tileIndex, move.trainId);

      var ctx = DominoAI.determineContext(stateObj, playerIndex, result);
      DominoAI.updateMood(stateObj, playerIndex, ctx);

      // 教练模式显示推理
      if (isCoachMode && move.reasoning) {
        player.latestMessage = "👨‍🏫 " + move.reasoning;
      } else {
        var msg = DominoAI.selectMessage(stateObj, playerIndex, ctx);
        if (msg) player.latestMessage = msg;
      }

      // 旁观模式记录思维过程
      if (isSpectatorMode && player.personality !== "human") {
        if (!player.thoughtLog) player.thoughtLog = [];
        player.thoughtLog.push(ctx);
      }

      var tile = result.tile;
      var tileStr = tile ? (tile[0] + "|" + tile[1]) : "?";
      var trainName = getTrainDisplayName(move.trainId, stateObj);
      addEvent(stateObj, playerIndex, "play",
        player.name + " 出了 [" + tileStr + "] → " + trainName);

      // 记录关键事件
      _trackKeyPlay(stateObj, playerIndex, result, move);
    } else {
      // AI 无法出牌
      if (stateObj.boneyard && stateObj.boneyard.length > 0) {
        var drawResult = DominoEngine.executeDraw(stateObj, playerIndex);
        var dctx = DominoAI.determineContext(stateObj, playerIndex, drawResult);
        DominoAI.updateMood(stateObj, playerIndex, dctx);
        var dmsg = DominoAI.selectMessage(stateObj, playerIndex, dctx);
        if (dmsg) player.latestMessage = dmsg;

        if (drawResult && drawResult.tile) {
          var dtile = drawResult.tile;
          addEvent(stateObj, playerIndex, "draw",
            player.name + " 摸了 [" + dtile[0] + "|" + dtile[1] + "]");
        }
        if (drawResult && drawResult.played) {
          var trainName = getTrainDisplayName(drawResult.trainId, stateObj);
          addEvent(stateObj, playerIndex, "play",
            player.name + " 打出摸到的牌 [" + drawResult.tile[0] + "|" + drawResult.tile[1] + "] → " + trainName);
        }
      } else {
        DominoEngine.executePass(stateObj, playerIndex);
        var pctx = { action: "pass" };
        DominoAI.updateMood(stateObj, playerIndex, pctx);
        var pmsg = DominoAI.selectMessage(stateObj, playerIndex, pctx);
        if (pmsg) player.latestMessage = pmsg;
        addEvent(stateObj, playerIndex, "pass",
          player.name + " 跳过回合，火车开放");
      }
    }

    renderAll();

    setTimeout(function() {
      DominoEngine.advanceTurn(stateObj);
      processNextTurn();
    }, isSpectatorMode ? 300 : 500);
  }

  // ============================================================================
  // 追踪关键事件（用于复盘分析）
  // ============================================================================
  function _trackKeyPlay(stateObj, playerIndex, result, move) {
    if (!stateObj.roundKeyPlays) stateObj.roundKeyPlays = [];
    if (!stateObj.roundStats) _initRoundStats(stateObj);

    var player = stateObj.players[playerIndex];
    var tileStr = result.tile ? (result.tile[0] + "|" + result.tile[1]) : "?";

    // 记录双牌
    if (result.wasDouble) {
      stateObj.roundStats.doublesPlayed[playerIndex] = (stateObj.roundStats.doublesPlayed[playerIndex] || 0) + 1;
      stateObj.roundKeyPlays.push({
        type: "double", playerIndex: playerIndex,
        desc: player.name + " 打出双牌 [" + tileStr + "]",
        importance: "high"
      });
    }

    // 记录封锁行为
    if (move.trainId && move.trainId !== "mexican" && move.trainId !== ("p" + playerIndex)) {
      var ownerIdx = parseInt(move.trainId.charAt(1), 10);
      if (!isNaN(ownerIdx) && ownerIdx !== playerIndex) {
        stateObj.roundStats.blocksByPlayer[playerIndex] = (stateObj.roundStats.blocksByPlayer[playerIndex] || 0) + 1;
        if (!stateObj.roundStats.blocksByPlayer["blocked_" + ownerIdx]) {
          stateObj.roundStats.blocksByPlayer["blocked_" + ownerIdx] = [];
        }
        stateObj.roundStats.blocksByPlayer["blocked_" + ownerIdx].push(playerIndex);
        stateObj.roundKeyPlays.push({
          type: "block", playerIndex: playerIndex, targetIndex: ownerIdx,
          desc: player.name + " 封锁了 " + stateObj.players[ownerIdx].name + " 的火车",
          importance: "medium"
        });
      }
    }

    // 记录墨西哥火车使用
    if (move.trainId === "mexican") {
      stateObj.roundStats.mexicanUsage[playerIndex] = (stateObj.roundStats.mexicanUsage[playerIndex] || 0) + 1;
    }

    // 记录满足双牌
    if (result.satisfiedDouble) {
      stateObj.roundKeyPlays.push({
        type: "satisfy", playerIndex: playerIndex,
        desc: player.name + " 满足了双牌",
        importance: "medium"
      });
    }

    // 限制关键事件数量
    if (stateObj.roundKeyPlays.length > 20) {
      stateObj.roundKeyPlays = stateObj.roundKeyPlays.slice(-20);
    }
  }

  function _initRoundStats(stateObj) {
    stateObj.roundStats = {
      blocksByPlayer: {},
      mexicanUsage: {},
      doublesPlayed: {}
    };
  }

  // ============================================================================
  // 游戏结束覆盖层
  // ============================================================================
  function showGameOver(stateObj) {
    if (!stateObj) stateObj = getState();
    if (!stateObj) return;

    var winner = DominoEngine.getWinner(stateObj);
    var overlay = $("overlay");
    var content = $("overlay-content");
    if (!overlay || !content) return;

    overlay.classList.remove("hidden");

    var winnerHTML = winner ?
      (winner.emoji + " " + winner.name + " 获胜！") :
      "游戏结束";

    var html = '<h2>&#x1F3C6; ' + winnerHTML + '</h2>';

    // 最终分数表
    html += '<table>';
    html += '<tr><th>玩家</th><th>最终总分</th></tr>';
    var players = stateObj.players;
    for (var i = 0; i < players.length; i++) {
      var p = players[i];
      var color = getPlayerColor(i);
      html += '<tr>';
      html += '<td style="color:' + color + ';">' + p.emoji + ' ' + p.name + '</td>';
      html += '<td>' + (p.totalScore || 0) + '分</td>';
      html += '</tr>';
    }
    html += '</table>';

    // 复盘分析
    html += _buildRoundAnalysis(stateObj);

    html += '<div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">';
    html += '<button class="overlay-btn" data-action="new_game">&#x1F504; 再来一局</button>';
    html += '<button class="overlay-btn" data-action="back_to_menu">&#x1F3E0; 返回菜单</button>';
    html += '</div>';
    content.innerHTML = html;

    stateObj.gameOver = true;
    stateObj.winner = winner;
  }

  // ============================================================================
  // 轮次总结覆盖层
  // ============================================================================
  function showRoundSummary(stateObj) {
    if (!stateObj) stateObj = getState();
    if (!stateObj) return;

    var overlay = $("overlay");
    var content = $("overlay-content");
    if (!overlay || !content) return;

    overlay.classList.remove("hidden");

    var roundNum = stateObj.roundNumber;

    var html = '<h2>第 ' + roundNum + ' 轮结束</h2>';

    html += '<table>';
    html += '<tr><th>玩家</th><th>本轮惩罚</th><th>累计总分</th></tr>';

    var players = stateObj.players;
    for (var i = 0; i < players.length; i++) {
      var p = players[i];
      var color = getPlayerColor(i);
      var penalty = 0;
      if (p.hand && p.hand.length > 0) {
        for (var h = 0; h < p.hand.length; h++) {
          penalty += DominoState.pips(p.hand[h]);
        }
      }
      html += '<tr>';
      html += '<td style="color:' + color + ';">' + p.emoji + ' ' + p.name + '</td>';
      html += '<td>+' + penalty + '分</td>';
      html += '<td>' + (p.totalScore || 0) + '分</td>';
      html += '</tr>';
    }
    html += '</table>';

    // ── 复盘分析 ──
    html += _buildRoundAnalysis(stateObj);

    html += '<button id="overlay-btn" data-action="next_round">&#x25B6; 下一轮</button>';
    content.innerHTML = html;
  }

  // ============================================================================
  // 构建复盘分析
  // ============================================================================
  function _buildRoundAnalysis(stateObj) {
    var html = '';

    // 1. 关键转折点
    var keyPlays = stateObj.roundKeyPlays || [];
    var highPlays = [];
    for (var k = 0; k < keyPlays.length; k++) {
      if (keyPlays[k].importance === "high") highPlays.push(keyPlays[k]);
    }
    var mediumPlays = [];
    for (var m = 0; m < keyPlays.length; m++) {
      if (keyPlays[m].importance === "medium") mediumPlays.push(keyPlays[m]);
    }

    if (highPlays.length > 0 || mediumPlays.length > 0) {
      html += '<div class="analysis-section">';
      html += '<h3>&#x1F4CA; 关键转折点</h3>';

      var displayPlays = highPlays.slice(0, 3);
      if (displayPlays.length === 0) displayPlays = mediumPlays.slice(0, 3);

      for (var dp = 0; dp < displayPlays.length; dp++) {
        var play = displayPlays[dp];
        var pColor = getPlayerColor(play.playerIndex);
        var pEmoji = getPlayerEmoji(play.playerIndex);
        html += '<p style="color:' + pColor + ';">' + pEmoji + ' ' + play.desc + '</p>';
      }
      html += '</div>';
    }

    // 2. AI 角色总结
    var hasAI = false;
    for (var a = 0; a < stateObj.players.length; a++) {
      if (stateObj.players[a].type === "ai") { hasAI = true; break; }
    }
    if (hasAI) {
      html += '<div class="analysis-section">';
      html += '<h3>&#x1F916; AI 角色总结</h3>';
      for (var ai = 0; ai < stateObj.players.length; ai++) {
        var ap = stateObj.players[ai];
        if (ap.type !== "ai" && ap.type !== "spectator") continue;
        if (ap.personality === "human") continue;

        // 根据性格生成总结
        var summary = _getPersonalitySummary(ap, stateObj);
        var aColor = getPlayerColor(ai);
        html += '<p style="color:' + aColor + ';">' + ap.emoji + ' ' + ap.name + ': ' + summary + '</p>';
      }
      html += '</div>';
    }

    // 3. 统计数据
    var stats = stateObj.roundStats;
    if (stats) {
      html += '<div class="analysis-section">';
      html += '<h3>&#x1F4CA; 本轮统计</h3>';

      // 墨西哥火车使用情况
      var mexUsers = [];
      var mexKeys = Object.keys(stats.mexicanUsage || {});
      for (var mu = 0; mu < mexKeys.length; mu++) {
        var mui = parseInt(mexKeys[mu], 10);
        if (!isNaN(mui) && (stats.mexicanUsage[mui] || 0) > 0) {
          mexUsers.push(getPlayerEmoji(mui) + " " + getPlayerName(mui) + ":" + stats.mexicanUsage[mui] + "次");
        }
      }
      if (mexUsers.length > 0) {
        html += '<div class="analysis-stat"><span>&#x1F1F2;&#x1F1FD; 墨西哥火车使用</span><span>' + mexUsers.join(", ") + '</span></div>';
      }

      // 封锁统计
      var blockKeys = Object.keys(stats.blocksByPlayer || {});
      var blockEntries = [];
      for (var bk = 0; bk < blockKeys.length; bk++) {
        if (blockKeys[bk].indexOf("blocked_") === 0) continue;
        var bki = parseInt(blockKeys[bk], 10);
        if (!isNaN(bki) && (stats.blocksByPlayer[bki] || 0) > 0) {
          blockEntries.push(getPlayerEmoji(bki) + ":" + stats.blocksByPlayer[bki] + "次");
        }
      }
      if (blockEntries.length > 0) {
        html += '<div class="analysis-stat"><span>&#x1F6AB; 封锁次数</span><span>' + blockEntries.join(", ") + '</span></div>';
      }

      // 双牌统计
      var doubleKeys = Object.keys(stats.doublesPlayed || {});
      var doubleEntries = [];
      for (var dk = 0; dk < doubleKeys.length; dk++) {
        var dki = parseInt(doubleKeys[dk], 10);
        if (!isNaN(dki) && (stats.doublesPlayed[dki] || 0) > 0) {
          doubleEntries.push(getPlayerEmoji(dki) + ":" + stats.doublesPlayed[dki] + "个");
        }
      }
      if (doubleEntries.length > 0) {
        html += '<div class="analysis-stat"><span>&#x1F3AF; 双牌</span><span>' + doubleEntries.join(", ") + '</span></div>';
      }

      html += '</div>';
    }

    return html;
  }

  function _getPersonalitySummary(player, stateObj) {
    var personality = player.personality;
    var handPips = 0;
    if (player.hand) {
      for (var i = 0; i < player.hand.length; i++) {
        handPips += DominoState.pips(player.hand[i]);
      }
    }
    var total = player.totalScore || 0;

    if (personality === "conservative") {
      if (handPips === 0) return "稳健策略奏效，完美清空手牌！";
      if (handPips < 10) return "保守打法效果不错，只留了很少的牌。";
      return "这轮运气欠佳，但稳扎稳打的风格依然可圈可点。";
    }
    if (personality === "aggressive") {
      if (handPips === 0) return "激进策略大获成功，速战速决！";
      if (handPips < 5) return "进攻型打法基本成功了，小有损失。";
      return "这轮冒险没赌对，但激进者从不畏惧失败。";
    }
    if (personality === "emotional") {
      var aiState = stateObj.aiStates ? stateObj.aiStates[player.index] : null;
      var mood = aiState ? aiState.mood : 0;
      if (mood > 0.3) return "这轮心情不错，发挥出色！";
      if (mood < -0.3) return "情绪低落的一轮，表现不太稳定。";
      return "情绪起伏中，表现中规中矩。";
    }
    if (personality === "coach") {
      if (handPips === 0) return "教学示范完美！这就是规划策略的成果。";
      return "这轮留下了部分牌，但在教学中展示了关键决策点。";
    }
    return "完成了本轮对局。";
  }

  // ============================================================================
  // 主菜单与游戏启动
  // ============================================================================
  function showMainMenu() {
    var menu = $("main-menu");
    var game = $("game-container");
    if (menu) menu.classList.remove("hidden");
    if (game) game.classList.add("hidden");
    DominoApp.currentMode = null;
  }

  function startGame(mode) {
    DominoApp.currentMode = mode || "standard";
    var menu = $("main-menu");
    var game = $("game-container");
    if (menu) menu.classList.add("hidden");
    if (game) game.classList.remove("hidden");

    // 更新模式徽章
    var badge = $("mode-badge");
    if (badge) {
      var modeCfg = DominoConfig.GAME_MODES[DominoApp.currentMode];
      if (modeCfg) {
        badge.textContent = modeCfg.icon + " " + modeCfg.name;
        badge.style.display = "inline-block";
      }
    }

    // 初始化游戏
    DominoApp.state = DominoState.initNewGame(DominoApp.currentMode);
    DominoEngine.initRound(DominoApp.state);
    renderAll();
    processNextTurn();
  }

  function handleBackToMenu() {
    var overlay = $("overlay");
    if (overlay) overlay.classList.add("hidden");
    showMainMenu();
  }

  // ============================================================================
  // 规则显示
  // ============================================================================
  function showRules() {
    var rulesOverlay = $("rules-overlay");
    if (rulesOverlay) rulesOverlay.classList.remove("hidden");
  }

  function hideRules() {
    var rulesOverlay = $("rules-overlay");
    if (rulesOverlay) rulesOverlay.classList.add("hidden");
  }

  // ============================================================================
  // 教练提示
  // ============================================================================
  function showCoachTip(stateObj, humanIdx) {
    var tipsEl = $("coach-tips");
    if (!tipsEl) return;
    var tip = DominoAI.generateTip(stateObj, humanIdx);
    tipsEl.innerHTML = "&#x1F4A1; 教练提示: " + tip;
    tipsEl.classList.remove("hidden");
    // 5秒后自动隐藏
    setTimeout(function() {
      if (tipsEl) tipsEl.classList.add("hidden");
    }, 8000);
  }

  // ============================================================================
  // 覆盖层动作处理
  // ============================================================================
  function handleNewGame() {
    var overlay = $("overlay");
    if (overlay) overlay.classList.add("hidden");

    var mode = DominoApp.currentMode || "standard";
    DominoApp.state = DominoState.initNewGame(mode);
    DominoEngine.initRound(DominoApp.state);
    renderAll();
    processNextTurn();
  }

  function handleNextRound() {
    var overlay = $("overlay");
    if (overlay) overlay.classList.add("hidden");

    var stateObj = getState();
    if (!stateObj) return;

    stateObj.roundNumber += 1;
    stateObj.roundKeyPlays = [];
    stateObj.roundStats = {
      blocksByPlayer: {},
      mexicanUsage: {},
      doublesPlayed: {}
    };
    DominoEngine.initRound(stateObj);
    renderAll();
    processNextTurn();
  }

  // ============================================================================
  // 火车显示名称
  // ============================================================================
  function getTrainDisplayName(trainId, stateObj) {
    if (trainId === "mexican") return "&#x1F1F2;&#x1F1FD; 墨西哥火车";

    // 从当前玩家配置动态生成火车名称
    if (trainId && stateObj && stateObj.players) {
      if (trainId.length >= 2 && trainId[0] === "p") {
        var idx = parseInt(trainId.charAt(1), 10);
        if (!isNaN(idx) && stateObj.players[idx]) {
          var p = stateObj.players[idx];
          var prefix = "";
          if (idx === stateObj.humanPlayerIndex) prefix = "&#x1F682; ";
          return prefix + p.emoji + " " + p.name + "的火车";
        }
      }
    }

    // 硬编码回退
    if (trainId === "p0") return "&#x1F682; 你的火车";
    if (trainId === "p1") return "&#x1F422; 老稳的火车";
    if (trainId === "p2") return "&#x1F525; 小冲的火车";
    if (trainId === "p3") return "&#x1F3AD; 大悲大喜的火车";

    return trainId;
  }

  // ============================================================================
  // 工具
  // ============================================================================
  function escapeHTML(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // ============================================================================
  // 公开 API
  // ============================================================================
  return {
    init: init,
    renderAll: renderAll,
    renderScores: renderScores,
    renderBoard: renderBoard,
    renderHand: renderHand,
    renderTileElement: renderTileElement,
    renderAICards: renderAICards,
    renderEventLog: renderEventLog,
    addEvent: addEvent,
    updateActionButtons: updateActionButtons,
    highlightLegalTrains: highlightLegalTrains,
    processNextTurn: processNextTurn,
    processAITurn: processAITurn,
    showGameOver: showGameOver,
    showRoundSummary: showRoundSummary,
    getTrainDisplayName: getTrainDisplayName,
    handleNewGame: handleNewGame,
    handleNextRound: handleNextRound
  };

})();
</script>
<script>
DominoUI.init();
</script>
</body>
