<script>
// === DominoState ===
// 墨西哥火车多米诺 — 游戏状态管理

var DominoState = (function() {
  "use strict";

  // 依赖 DominoConfig（需先加载 config.js）
  var C = (typeof DominoConfig !== "undefined") ? DominoConfig : null;

  // ============================================================================
  // 骨牌工具函数
  // ============================================================================

  /** 返回骨牌的字符串 key，如 [3,7] → "3-7" */
  function tileKey(tile) {
    return tile[0] + "-" + tile[1];
  }

  /** 返回骨牌的点数总和 */
  function pips(tile) {
    return tile[0] + tile[1];
  }

  /** 是否为双牌（两端相同） */
  function isDouble(tile) {
    return tile[0] === tile[1];
  }

  /** 骨牌的某一端是否匹配指定值 */
  function matches(tile, value) {
    return tile[0] === value || tile[1] === value;
  }

  /** 返回骨牌中不匹配 matchValue 的另一端值；
   *  如果两端都匹配，返回 —1；如果都不匹配，返回 —1。 */
  function otherEnd(tile, matchValue) {
    if (tile[0] === matchValue && tile[1] === matchValue) return tile[0];
    if (tile[0] === matchValue) return tile[1];
    if (tile[1] === matchValue) return tile[0];
    return -1;
  }

  /** Fisher——Yates 洗牌算法，返回新数组 */
  function shuffleTiles(tiles) {
    var arr = tiles.slice();
    var i, j, tmp;
    for (i = arr.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  // ============================================================================
  // 数据创建函数
  // ============================================================================

  /** 创建一个火车对象 */
  function createTrain(id, ownerIndex) {
    return {
      id: id,
      tiles: [],
      openValue: null,
      isPublic: false,
      ownerIndex: (ownerIndex !== undefined) ? ownerIndex : null,
      hasUnsatisfiedDouble: false,
      unsatisfiedDoubleValue: null
    };
  }

  /** 根据玩家配置创建一个 Player 对象 */
  function createPlayer(config, index) {
    // config 来自 DominoConfig.PLAYERS[index]
    if (config.index !== index) {
      console.warn("createPlayer: config.index 与参数 index 不一致，以参数为准。");
    }
    return {
      index: index,
      name: config.name,
      type: config.type,
      personality: config.personality,
      emoji: config.emoji,
      color: config.color,
      hand: [],
      scoreHistory: [],
      totalScore: 0
    };
  }

  /** 创建一个 AI 状态对象 */
  function createAIState() {
    return {
      mood: 0.0,
      moodHistory: [],
      lastEventType: ""
    };
  }

  // ============================================================================
  // 主游戏状态创建
  // ============================================================================

  /** 创建空游戏状态（不含 initNewGame 的初始化过程） */
  function createGameState() {
    return {
      phase: "idle",
      players: [],
      trains: [],
      boneyard: [],
      roundNumber: 1,
      currentPlayerIndex: 0,
      engineValue: null,
      pendingDoublePlayer: null,
      pendingDoubleTrainId: null,
      selectedTileIndex: null,
      selectedTrainId: null,
      eventLog: [],
      aiStates: [],
      gameOver: false,
      winner: null
    };
  }

  /** 初始化一局全新游戏
   *  @param {string} mode - "standard" | "coach" | "spectator"
   */
  function initNewGame(mode) {
    if (!C) {
      throw new Error("DominoState.initNewGame: DominoConfig 未加载，请先引入 config.js");
    }

    mode = mode || "standard";
    var modeCfg = C.GAME_MODES ? C.GAME_MODES[mode] : null;
    if (!modeCfg) {
      modeCfg = C.GAME_MODES ? C.GAME_MODES["standard"] : null;
    }

    var playerConfigs = (modeCfg && modeCfg.players) ? modeCfg.players : C.PLAYERS;
    var playerCount = (modeCfg && modeCfg.playerCount) ? modeCfg.playerCount : C.PLAYER_COUNT;
    var humanPlayerIndex = (modeCfg && modeCfg.humanPlayerIndex !== undefined) ? modeCfg.humanPlayerIndex : 0;

    // 1. 生成并洗牌
    var allTiles = C.generateTiles();
    var shuffled = shuffleTiles(allTiles);

    // 调整发牌数量使每人手牌合理
    var handSize = C.HAND_SIZE;
    if (mode === "coach") {
      handSize = 15; // 2人局每人更多牌
    }

    // 2. 创建玩家并发牌
    var players = [];
    var aiStates = [];

    for (var i = 0; i < playerCount; i++) {
      var cfg = playerConfigs[i];
      var player = createPlayer(cfg, i);
      var hand = shuffled.splice(0, handSize);
      player.hand = hand;
      players.push(player);
      aiStates.push(createAIState());
    }

    // 3. 剩余的牌就是 boneyard
    var boneyard = shuffled;

    // 4. 找到引擎双牌（场上最大的双牌）和持有者
    var engineValue = -1;
    var engineOwnerIndex = 0;

    for (var p = 0; p < players.length; p++) {
      var handArr = players[p].hand;
      for (var t = 0; t < handArr.length; t++) {
        var tile = handArr[t];
        if (isDouble(tile) && tile[0] > engineValue) {
          engineValue = tile[0];
          engineOwnerIndex = p;
        }
      }
    }

    if (engineValue === -1) {
      throw new Error("initNewGame: 未在任何玩家手中找到双牌，无法确定引擎值。");
    }

    // 5. 创建火车（只创建与玩家数量匹配的个人火车）
    var personalTrainIds = [];
    for (var tr = 0; tr < playerCount; tr++) {
      personalTrainIds.push("p" + tr);
    }
    C.TRAIN_IDS.PERSONAL_TRAINS = personalTrainIds;
    C.TRAIN_IDS.ALL_TRAINS = personalTrainIds.concat(["mexican"]);

    var trains = [];
    for (var trIdx = 0; trIdx < personalTrainIds.length; trIdx++) {
      var tid = personalTrainIds[trIdx];
      var train = createTrain(tid, trIdx);
      train.openValue = engineValue;
      train.isPublic = false;
      trains.push(train);
    }
    // 墨西哥火车
    var mexicanTrain = createTrain(C.TRAIN_IDS.MEXICAN_TRAIN, null);
    mexicanTrain.openValue = engineValue;
    mexicanTrain.isPublic = true;
    trains.push(mexicanTrain);

    // 6. 构建游戏状态
    var state = createGameState();
    state.players = players;
    state.trains = trains;
    state.boneyard = boneyard;
    state.roundNumber = 1;
    state.currentPlayerIndex = engineOwnerIndex;
    state.engineValue = engineValue;
    state.aiStates = aiStates;
    state.gameMode = mode;
    state.humanPlayerIndex = humanPlayerIndex;
    state.roundKeyPlays = [];
    state.roundStats = {
      blocksByPlayer: {},
      mexicanUsage: {},
      doublesPlayed: {}
    };

    // 初始阶段
    state.phase = "waiting_human";
    if (humanPlayerIndex < 0 || humanPlayerIndex >= players.length) {
      state.phase = "ai_thinking";
    } else if (players[engineOwnerIndex].type === "ai" || players[engineOwnerIndex].type === "spectator") {
      state.phase = "ai_thinking";
    }

    return state;
  }

  // ============================================================================
  // 公开 API
  // ============================================================================
  return {
    // 工具
    tileKey: tileKey,
    pips: pips,
    isDouble: isDouble,
    matches: matches,
    otherEnd: otherEnd,
    shuffleTiles: shuffleTiles,

    // 工厂
    createTrain: createTrain,
    createPlayer: createPlayer,
    createAIState: createAIState,
    createGameState: createGameState,

    // 初始化
    initNewGame: initNewGame
  };

})();
</script>
<script>
// === DominoEngine ===
// Mexican Train Domino — Game Engine Module
// Depends on: DominoConfig, DominoState (already loaded)

const DominoEngine = (function() {

  // ─── Tile Generation ───────────────────────────────────────────

  /** Generate all 55 tiles for a double-9 domino set. */
  function _generateAllTiles() {
    const tiles = [];
    for (let i = 0; i <= 9; i++) {
      for (let j = i; j <= 9; j++) {
        tiles.push([i, j]);
      }
    }
    return tiles;
  }

  // ─── initRound ─────────────────────────────────────────────────

  /**
   * Reset state for a new round. Modifies the existing stateObj in place.
   * - Shuffles and deals tiles to all players.
   * - Finds the highest double across all hands as the engine.
   * - Places the engine on the Mexican train.
   * - Initializes train open values and flags.
   */
  function initRound(stateObj) {
    const allTiles = DominoState.shuffleTiles(_generateAllTiles());
    const { players, trains } = stateObj;

    // Deal HAND_SIZE tiles to each player
    const handSize = DominoConfig.HAND_SIZE;
    for (let i = 0; i < players.length; i++) {
      players[i].hand = allTiles.splice(0, handSize);
    }

    // Remaining tiles become the boneyard
    stateObj.boneyard = allTiles.slice();

    // Find the engine — the highest-value double across all hands
    let bestDouble = null;
    let bestValue = -1;
    let enginePlayerIndex = -1;

    for (let i = 0; i < players.length; i++) {
      const hand = players[i].hand;
      for (let tileIdx = 0; tileIdx < hand.length; tileIdx++) {
        const tile = hand[tileIdx];
        if (DominoState.isDouble(tile)) {
          const val = tile[0];
          if (val > bestValue) {
            bestValue = val;
            bestDouble = tile;
            enginePlayerIndex = i;
          }
        }
      }
    }

    // Remove engine tile from its owner's hand
    if (enginePlayerIndex >= 0 && bestDouble) {
      const engineHand = players[enginePlayerIndex].hand;
      const engIdx = engineHand.findIndex(
        t => t[0] === bestDouble[0] && t[1] === bestDouble[1]
      );
      if (engIdx >= 0) {
        engineHand.splice(engIdx, 1);
      }
    }

    stateObj.engineValue = bestValue;
    stateObj.currentPlayerIndex = enginePlayerIndex;
    stateObj.pendingDoublePlayer = null;
    stateObj.pendingDoubleTrainId = null;

    // Place the engine tile on the Mexican train
    const mexicanTrain = trains.find(t => t.id === "mexican");
    if (mexicanTrain && bestDouble) {
      mexicanTrain.tiles = [bestDouble];
    }

    // Initialize all trains
    for (const train of trains) {
      train.openValue = bestValue;
      train.hasUnsatisfiedDouble = false;
      train.unsatisfiedDoubleValue = null;
      if (train.id === "mexican") {
        train.isPublic = true;
        if (!train.tiles || train.tiles.length === 0) {
          train.tiles = bestDouble ? [bestDouble] : [];
        }
      } else {
        train.isPublic = false;
        train.tiles = [];
      }
    }

    // Set initial phase
    stateObj.phase = _phaseForPlayer(players[enginePlayerIndex]);
  }

  // ─── getLegalMoves ─────────────────────────────────────────────

  /**
   * Returns all legal moves for a player as {tileIndex, tile, trainId, train}.
   * Handles pending-double logic: the player who played the double MUST attempt
   * to satisfy it on their extra turn; other players try to satisfy first,
   * falling back to normal play if they cannot.
   */
  function getLegalMoves(stateObj, playerIndex) {
    const { players, trains, pendingDoublePlayer, pendingDoubleTrainId } = stateObj;
    const player = players[playerIndex];
    const hand = player.hand;

    // First pass: collect all valid (tile, train) pairs ignoring double restrictions
    const rawMoves = [];

    for (let tileIndex = 0; tileIndex < hand.length; tileIndex++) {
      const tile = hand[tileIndex];

      for (const train of trains) {
        // Accessibility check
        if (train.ownerIndex !== playerIndex && train.id !== "mexican" && !train.isPublic) {
          continue;
        }

        // Blocked by the train's own unsatisfied double?
        if (train.hasUnsatisfiedDouble && !DominoState.matches(tile, train.unsatisfiedDoubleValue)) {
          continue;
        }

        // Must match the train's open value
        if (!DominoState.matches(tile, train.openValue)) {
          continue;
        }

        rawMoves.push({ tileIndex, tile, trainId: train.id, train });
      }
    }

    // Apply pending-double restrictions
    if (pendingDoublePlayer !== null && pendingDoubleTrainId !== null) {
      const pendingTrain = trains.find(t => t.id === pendingDoubleTrainId);
      const doubleValue = pendingTrain ? pendingTrain.unsatisfiedDoubleValue : null;

      if (playerIndex === pendingDoublePlayer) {
        // This player MUST satisfy their own double — only those moves permitted
        return rawMoves.filter(
          m => m.trainId === pendingDoubleTrainId && DominoState.matches(m.tile, doubleValue)
        );
      } else {
        // Other players: try to satisfy the double first
        const satisfyingMoves = rawMoves.filter(
          m => m.trainId === pendingDoubleTrainId && DominoState.matches(m.tile, doubleValue)
        );
        if (satisfyingMoves.length > 0) {
          return satisfyingMoves; // Must satisfy — only return these
        }
        // Cannot satisfy — return all moves (may be empty)
      }
    }

    return rawMoves;
  }

  // ─── executePlay ───────────────────────────────────────────────

  /**
   * Execute a play action from a player's hand onto a train.
   * Returns {tile, wasDouble, satisfiedDouble, handEmpty}.
   */
  function executePlay(stateObj, playerIndex, tileIndex, trainId) {
    const { players, trains } = stateObj;
    const player = players[playerIndex];
    const train = trains.find(t => t.id === trainId);

    // Remove tile from hand
    const tile = player.hand.splice(tileIndex, 1)[0];

    // Determine new open value
    const newOpenValue = DominoState.otherEnd(tile, train.openValue);

    // Record that we are satisfying a previously unsatisfied double
    const wasSatisfying = train.hasUnsatisfiedDouble;

    // Place tile on train
    train.tiles.push(tile);
    train.openValue = newOpenValue;

    // Double logic
    if (DominoState.isDouble(tile)) {
      train.hasUnsatisfiedDouble = true;
      train.unsatisfiedDoubleValue = tile[0];
      stateObj.pendingDoublePlayer = playerIndex;
      stateObj.pendingDoubleTrainId = trainId;
      return {
        tile: tile,
        wasDouble: true,
        satisfiedDouble: false,
        handEmpty: player.hand.length === 0
      };
    }

    // Satisfying a previous double (tile itself is not a double)
    if (wasSatisfying) {
      train.hasUnsatisfiedDouble = false;
      train.unsatisfiedDoubleValue = null;
      stateObj.pendingDoublePlayer = null;
      stateObj.pendingDoubleTrainId = null;
      return {
        tile: tile,
        wasDouble: false,
        satisfiedDouble: true,
        handEmpty: player.hand.length === 0
      };
    }

    // Normal non-double play
    return {
      tile: tile,
      wasDouble: false,
      satisfiedDouble: false,
      handEmpty: player.hand.length === 0
    };
  }

  // ─── executeDraw ───────────────────────────────────────────────

  /**
   * Player draws from the boneyard. If the drawn tile can be legally played,
   * it is automatically played. Otherwise it is added to the player's hand and
   * the player's personal train is marked public.
   * Returns {tile, played, ...playResult} or null if boneyard is empty.
   */
  function executeDraw(stateObj, playerIndex) {
    const { players, trains } = stateObj;

    if (stateObj.boneyard.length === 0) {
      return null;
    }

    const tile = stateObj.boneyard.pop();
    const player = players[playerIndex];

    // Temporarily add tile to hand so getLegalMoves can find it
    player.hand.push(tile);
    const legalMoves = getLegalMoves(stateObj, playerIndex);
    const tileMoves = legalMoves.filter(m => {
      const t = m.tile;
      return t[0] === tile[0] && t[1] === tile[1];
    });

    if (tileMoves.length > 0) {
      // Remove the just-added tile so executePlay's splice uses the right index
      player.hand.pop();
      const tempIdx = player.hand.length; // append, then play from that index
      player.hand.push(tile);
      const playResult = executePlay(stateObj, playerIndex, tempIdx, tileMoves[0].trainId);
      return {
        tile: tile,
        played: true,
        drawn: true,
        wasDouble: playResult.wasDouble,
        satisfiedDouble: playResult.satisfiedDouble,
        trainId: tileMoves[0].trainId
      };
    }

    // Cannot play — tile stays in hand, personal train becomes public
    // (tile was already pushed, so leave it there)
    const personalTrain = trains.find(t => t.ownerIndex === playerIndex && t.id !== "mexican");
    if (personalTrain) {
      personalTrain.isPublic = true;
    }
    return {
      tile: tile,
      played: false,
      drawn: true
    };
  }

  // ─── executePass ───────────────────────────────────────────────

  /**
   * Player passes their turn. Their personal train is marked public (open
   * for others to play on). Returns true.
   */
  function executePass(stateObj, playerIndex) {
    const { trains } = stateObj;
    const personalTrain = trains.find(t => t.ownerIndex === playerIndex && t.id !== "mexican");
    if (personalTrain) {
      personalTrain.isPublic = true;
    }
    return true;
  }

  // ─── advanceTurn ───────────────────────────────────────────────

  /**
   * Advance to the next player after the current turn.
   * - If a double was just played (pendingDoublePlayer === currentPlayerIndex),
   *   the same player gets an extra turn to satisfy it.
   * - Otherwise, rotate to the next player.
   */
  function advanceTurn(stateObj) {
    const { players, pendingDoublePlayer } = stateObj;

    if (pendingDoublePlayer !== null && pendingDoublePlayer === stateObj.currentPlayerIndex) {
      // Same player gets an extra turn — phase stays the same
      return;
    }

    // Advance to next player
    const nextIndex = (stateObj.currentPlayerIndex + 1) % players.length;
    stateObj.currentPlayerIndex = nextIndex;
    stateObj.phase = _phaseForPlayer(players[nextIndex]);
  }

  // ─── isRoundOver ───────────────────────────────────────────────

  /**
   * A round ends when any player runs out of tiles, OR when the boneyard is
   * empty and no player has a legal move (stalemate).
   */
  function isRoundOver(stateObj) {
    const { players } = stateObj;

    // Any player with empty hand ends the round
    for (const player of players) {
      if (player.hand.length === 0) {
        return true;
      }
    }

    // Boneyard empty and no player can move
    if (stateObj.boneyard.length === 0) {
      for (let i = 0; i < players.length; i++) {
        if (getLegalMoves(stateObj, i).length > 0) {
          return false;
        }
      }
      return true;
    }

    return false;
  }

  // ─── scoreRound ────────────────────────────────────────────────

  /**
   * Calculate and record round scores. Each player's score is the sum of
   * pips on tiles remaining in their hand (0 for the player who emptied
   * their hand). Pushes scores to each player's scoreHistory and totalScore.
   * Returns an array of round scores keyed by player index.
   */
  function scoreRound(stateObj) {
    const { players } = stateObj;
    const roundScores = [];

    for (let i = 0; i < players.length; i++) {
      const hand = players[i].hand;
      let score = 0;
      for (const tile of hand) {
        score += DominoState.pips(tile);
      }
      // Player with empty hand scores 0 (already handled — loop gives 0)
      players[i].scoreHistory.push(score);
      players[i].totalScore += score;
      roundScores.push(score);
    }

    return roundScores;
  }

  // ─── isGameOver ────────────────────────────────────────────────

  /**
   * The game ends when any player's total score reaches or exceeds the
   * target score (TARGET_SCORE from DominoConfig). Sets stateObj.gameOver
   * and stateObj.winner (player with lowest total score).
   */
  function isGameOver(stateObj) {
    const target = DominoConfig.TARGET_SCORE;
    const { players } = stateObj;

    for (const player of players) {
      if (player.totalScore >= target) {
        stateObj.gameOver = true;
        // Winner is the player with the lowest total score
        let bestPlayer = players[0];
        for (let i = 1; i < players.length; i++) {
          if (players[i].totalScore < bestPlayer.totalScore) {
            bestPlayer = players[i];
          }
        }
        stateObj.winner = bestPlayer;
        return true;
      }
    }

    return false;
  }

  // ─── getWinner ─────────────────────────────────────────────────

  /**
   * Returns the player with the lowest total score, or null if scores
   * are not yet available.
   */
  function getWinner(stateObj) {
    const { players } = stateObj;
    if (!players || players.length === 0) return null;

    let best = players[0];
    for (let i = 1; i < players.length; i++) {
      if (players[i].totalScore < best.totalScore) {
        best = players[i];
      }
    }
    return best;
  }

  // ─── Internal Helpers ──────────────────────────────────────────

  /**
   * Determine the correct phase string for a player based on their type.
   */
  function _phaseForPlayer(player) {
    if (!player) return "waiting_human";
    if (player.type === "human") return "waiting_human";
    return "ai_thinking";
  }

  // ─── Public API ────────────────────────────────────────────────

  return {
    initRound: initRound,
    getLegalMoves: getLegalMoves,
    executePlay: executePlay,
    executeDraw: executeDraw,
    executePass: executePass,
    advanceTurn: advanceTurn,
    isRoundOver: isRoundOver,
    scoreRound: scoreRound,
    isGameOver: isGameOver,
    getWinner: getWinner
  };

})();
</script>
<script>
// === DominoAI ===
// 墨西哥火车多米诺 — AI 决策引擎
// 为三种拟人性格（保守型、冒险型、情绪型）提供出牌策略、情绪系统与对话选择

var DominoAI = (function() {
  "use strict";

  // ============================================================================
  // 内部工具函数
  // ============================================================================

  /**
   * 从 trainId 中提取玩家索引。 "p0" -> 0, "p1" -> 1, "mexican" -> -1
   */
  function _trainOwnerIndex(trainId) {
    if (trainId === "mexican") return -1;
    if (trainId && trainId[0] === "p") {
      var idx = parseInt(trainId.substring(1), 10);
      return isNaN(idx) ? -1 : idx;
    }
    return -1;
  }

  /**
   * 限制值到 [min, max] 范围。
   */
  function _clamp(val, min, max) {
    if (val < min) return min;
    if (val > max) return max;
    return val;
  }

  /**
   * 获取火车当前开放端点值。若无牌则为 -1。
   */
  function _getTrainOpenValue(stateObj, trainId) {
    var trains = stateObj.trains || [];
    var train = null;
    for (var t = 0; t < trains.length; t++) {
      if (trains[t].id === trainId) { train = trains[t]; break; }
    }
    if (train) {
      return train.openValue;
    }
    // 后备：从 train 的 tiles 推导
    if (train && train.tiles && train.tiles.length > 0) {
      return train.tiles[train.tiles.length - 1];
    }
    return -1;
  }

  /**
   * 获取玩家当前 mood（情绪型专用）。不存在则初始化为 0。
   */
  function _getMood(stateObj, playerIndex) {
    if (!stateObj.aiStates) {
      stateObj.aiStates = [];
    }
    if (!stateObj.aiStates[playerIndex]) {
      stateObj.aiStates[playerIndex] = { mood: 0.0, moodHistory: [], lastEventType: null };
    }
    return stateObj.aiStates[playerIndex].mood;
  }

  /**
   * 获取玩家 aiStates 对象。不存在则初始化。
   */
  function _getAIState(stateObj, playerIndex) {
    if (!stateObj.aiStates) {
      stateObj.aiStates = [];
    }
    if (!stateObj.aiStates[playerIndex]) {
      stateObj.aiStates[playerIndex] = { mood: 0.0, moodHistory: [], lastEventType: null };
    }
    return stateObj.aiStates[playerIndex];
  }

  // ============================================================================
  // getEffectiveWeights
  // ============================================================================

  /**
   * 获取当前有效的权重对象。
   * - conservative / aggressive: 直接返回静态权重
   * - emotional: 用 mood 调制基础权重
   *
   * @param {string}  personalityId - "conservative" | "aggressive" | "emotional"
   * @param {number}  mood - 当前情绪值 [-1, 1]
   * @returns {object} { d1_ownTrain, d2_mexican, ..., d8_selfBlock }
   */
  function getEffectiveWeights(personalityId, mood) {
    var cfg = DominoConfig.PERSONALITIES[personalityId];
    if (!cfg) {
      // 默认退回保守型
      return DominoConfig.PERSONALITIES.conservative.weights;
    }

    // 非情绪型：静态权重
    if (personalityId !== "emotional") {
      return cfg.weights;
    }

    // 情绪型：根据 mood 调制
    var base = cfg.weightsBase;
    var sens = cfg.moodSensitivities;
    var clampedMood = _clamp(mood || 0, -1.0, 1.0);

    // 维度名 -> 敏感度键名映射
    var dimToSensKey = {
      d1_ownTrain:   "s1_ownTrain",
      d2_mexican:    "s2_mexican",
      d3_block:      "s3_block",
      d4_pipRisk:    "s4_pipRisk",
      d5_diversity:  "s5_diversity",
      d6_empty:      "s6_empty",
      d7_double:     "s7_double",
      d8_selfBlock:  "s8_selfBlock"
    };

    var effective = {};
    var dims = Object.keys(base);
    for (var i = 0; i < dims.length; i++) {
      var d = dims[i];
      var sensitivity = sens[dimToSensKey[d]] || 0;
      var w = base[d] * (1.0 + clampedMood * sensitivity);
      effective[d] = _clamp(w, 0.0, 1.0);
    }
    return effective;
  }

  // ============================================================================
  // scoreMove
  // ============================================================================

  /**
   * 为一个合法出牌打分（8 维度加权求和）。
   *
   * @param {object} stateObj   - 完整游戏状态
   * @param {number} playerIndex - AI 玩家索引
   * @param {object} move       - { tileIndex, tile, trainId }
   * @param {object} weights    - getEffectiveWeights 的返回值
   * @returns {number} 综合得分
   */
  function scoreMove(stateObj, playerIndex, move, weights) {
    var hand = stateObj.players[playerIndex].hand;
    var tile = move.tile;
    var trainId = move.trainId;
    var handSizeBefore = hand.length;

    // 此移动后的剩余手牌（排除当前 tile）
    var remainingHand = [];
    for (var i = 0; i < hand.length; i++) {
      if (i !== move.tileIndex) {
        remainingHand.push(hand[i]);
      }
    }
    var handSizeAfter = remainingHand.length;

    // ---- 获取火车当前开放值 ----
    var openValue = _getTrainOpenValue(stateObj, trainId);

    /**
     * 辅助：获取 tile 的 pip 端点值列表（不含匹配值）
     * 如需查找与 openValue 匹配并得到新开放值，使用 engine 侧的匹配逻辑。
     * 这里用 DominoState.otherEnd 计算匹配端对应的另一端。
     */
    var newOpenValue = openValue;
    if (openValue >= 0 && DominoState.matches(tile, openValue)) {
      newOpenValue = DominoState.otherEnd(tile, openValue);
    }

    // ---- d1_ownTrain: 目标自己的火车 +1.0, 墨西哥火车 0.0, 其他人火车 -0.5 ----
    var d1_ownTrain = 0.0;
    if (trainId === "p" + playerIndex) {
      d1_ownTrain = 1.0;
    } else if (trainId === "mexican") {
      d1_ownTrain = 0.0;
    } else {
      d1_ownTrain = -0.5;
    }

    // ---- d2_mexican: 放到墨西哥火车 +1.0 ----
    var d2_mexican = (trainId === "mexican") ? 1.0 : 0.0;

    // ---- d3_block: 卡其他玩家火车 ----
    var d3_block = 0.0;
    var ownerIdx = _trainOwnerIndex(trainId);
    if (ownerIdx >= 0 && ownerIdx !== playerIndex) {
      var otherHandSize = stateObj.players[ownerIdx] ? stateObj.players[ownerIdx].hand.length : 10;
      d3_block = 0.5 + (otherHandSize <= 3 ? 0.5 : 0.0);
    }

    // ---- d4_pipRisk: 点数越高风险越大，优先清掉 ----
    var pipsVal = DominoState.pips(tile);
    var d4_pipRisk = pipsVal / 18.0;

    // ---- d5_diversity: 剩余手牌中唯一 pip 值种类 / 剩余手牌数 ----
    var d5_diversity = 0.0;
    if (handSizeAfter > 0) {
      var uniquePips = {};
      for (var j = 0; j < remainingHand.length; j++) {
        var t = remainingHand[j];
        uniquePips[t[0]] = true;
        uniquePips[t[1]] = true;
      }
      var uniqueCount = Object.keys(uniquePips).length;
      d5_diversity = uniqueCount / handSizeAfter;
    }

    // ---- d6_empty: 清空奖励 ----
    var d6_empty = 0.0;
    if (handSizeAfter === 0) {
      d6_empty = 2.0;
    } else if (handSizeAfter <= 2) {
      d6_empty = 0.5;
    }

    // ---- d7_double: 双牌加分 ----
    var d7_double = DominoState.isDouble(tile) ? 0.3 : 0.0;

    // ---- d8_selfBlock: 自堵惩罚 ----
    var d8_selfBlock = 0.0;
    if (newOpenValue >= 0 && handSizeAfter > 0) {
      var matchCount = 0;
      for (var k = 0; k < remainingHand.length; k++) {
        if (DominoState.matches(remainingHand[k], newOpenValue)) {
          matchCount++;
        }
      }
      if (matchCount === 0) {
        d8_selfBlock = -1.0;      // 剩余牌完全无法接上
      } else if (matchCount <= 2) {
        d8_selfBlock = -0.3;      // 勉强能接
      } else {
        d8_selfBlock = 0.0;       // 充裕
      }
    }

    // 加权求和
    var score =
      d1_ownTrain   * (weights.d1_ownTrain   || 0) +
      d2_mexican    * (weights.d2_mexican    || 0) +
      d3_block      * (weights.d3_block      || 0) +
      d4_pipRisk    * (weights.d4_pipRisk    || 0) +
      d5_diversity  * (weights.d5_diversity  || 0) +
      d6_empty      * (weights.d6_empty      || 0) +
      d7_double     * (weights.d7_double     || 0) +
      d8_selfBlock  * (weights.d8_selfBlock  || 0);

    return score;
  }

  // ============================================================================
  // selectMove
  // ============================================================================

  /**
   * AI 选择最佳出牌。
   *
   * @param {object} stateObj   - 完整游戏状态
   * @param {number} playerIndex - AI 玩家索引
   * @returns {object|null} { tileIndex, tile, trainId, score } 或 null（无合法出牌）
   */
  function selectMove(stateObj, playerIndex) {
    var legalMoves = DominoEngine.getLegalMoves(stateObj, playerIndex);

    if (!legalMoves || legalMoves.length === 0) {
      return null;
    }

    // 仅一个选择时直接返回
    if (legalMoves.length === 1) {
      var onlyMove = legalMoves[0];
      return {
        tileIndex: onlyMove.tileIndex,
        tile: onlyMove.tile,
        trainId: onlyMove.trainId,
        score: 1.0
      };
    }

    var playerCfg = stateObj.players[playerIndex];
    var personalityId = playerCfg.personality;
    var mood = _getMood(stateObj, playerIndex);
    var weights = getEffectiveWeights(personalityId, mood);

    // 为每个合法出牌打分
    var scored = [];
    for (var i = 0; i < legalMoves.length; i++) {
      var move = legalMoves[i];
      var baseScore = scoreMove(stateObj, playerIndex, move, weights);
      // 添加 ±5% 随机因子以产生变化
      var score = baseScore * (0.95 + Math.random() * 0.1);
      scored.push({
        tileIndex: move.tileIndex,
        tile: move.tile,
        trainId: move.trainId,
        score: score
      });
    }

    // 按得分降序排列
    scored.sort(function(a, b) {
      return b.score - a.score;
    });

    return scored[0];
  }

  // ============================================================================
  // selectMessage
  // ============================================================================

  /**
   * 根据情景与性格选取对话文本。
   *
   * @param {object} stateObj   - 完整游戏状态
   * @param {number} playerIndex - AI 玩家索引
   * @param {string} context    - 情景标签（on_good_play, on_draw 等）
   * @returns {string} 对话文本
   */
  function selectMessage(stateObj, playerIndex, context) {
    var playerCfg = stateObj.players[playerIndex];
    var personalityId = playerCfg.personality;
    var cfg = DominoConfig.PERSONALITIES[personalityId];

    if (!cfg || !cfg.messagePools) {
      return "...";
    }

    var pool = cfg.messagePools[context];
    if (!pool) {
      // 尝试回退到 on_good_play
      pool = cfg.messagePools["on_good_play"];
      if (!pool) return "...";
    }

    // 情绪型需要按 mood 选取正/负面子池
    if (personalityId === "emotional") {
      var mood = _getMood(stateObj, playerIndex);
      var subPool;
      if (mood > 0.3) {
        subPool = pool.positive;
      } else if (mood < -0.3) {
        subPool = pool.negative;
      } else {
        // 中性情绪：随机合并两个子池
        var combined = (pool.positive || []).concat(pool.negative || []);
        if (combined.length === 0) return "...";
        return combined[Math.floor(Math.random() * combined.length)];
      }
      if (!subPool || subPool.length === 0) return "...";
      return subPool[Math.floor(Math.random() * subPool.length)];
    }

    // 保守型 / 冒险型：pool 直接是字符串数组
    if (Array.isArray(pool) && pool.length > 0) {
      return pool[Math.floor(Math.random() * pool.length)];
    }

    return "...";
  }

  // ============================================================================
  // determineContext
  // ============================================================================

  /**
   * 根据刚发生的动作确定情景标签。
   *
   * @param {object} stateObj     - 完整游戏状态
   * @param {number} playerIndex  - AI 玩家索引
   * @param {object} actionResult - Engine 返回的动作结果
   *   { played, wasDouble, satisfiedDouble, drawn, passed, handEmpty, trainId }
   * @returns {string} 情景标签
   */
  function determineContext(stateObj, playerIndex, actionResult) {
    var hand = stateObj.players[playerIndex].hand;
    var handSize = hand ? hand.length : 0;

    // 赢得本局（手牌清空）
    if (actionResult.played && actionResult.handEmpty) {
      return "on_win_round";
    }

    // 打出双牌
    if (actionResult.wasDouble) {
      return "on_double";
    }

    // 满足双牌规则
    if (actionResult.satisfiedDouble) {
      return "on_good_play";
    }

    // 打出到其他玩家的火车（封锁）
    if (actionResult.played && actionResult.trainId) {
      var ownerIdx = _trainOwnerIndex(actionResult.trainId);
      if (ownerIdx >= 0 && ownerIdx !== playerIndex) {
        return "on_block_other";
      }
    }

    // 摸牌后打出了
    if (actionResult.drawn && actionResult.played) {
      return "on_draw_useful";
    }

    // 摸牌后没打出
    if (actionResult.drawn && !actionResult.played) {
      return "on_draw_useless";
    }

    // 仅摸牌
    if (actionResult.drawn && !actionResult.played && !actionResult.passed) {
      return "on_draw_useless";
    }

    // 有打出（通用 good play）
    if (actionResult.played) {
      return "on_good_play";
    }

    // 跳过
    if (actionResult.passed) {
      return "on_pass";
    }

    // 手牌接近胜利
    if (handSize > 0 && handSize <= 2) {
      return "on_near_victory";
    }

    // 摸牌（无其他信息时）
    if (actionResult.drawn) {
      return "on_draw";
    }

    return "on_good_play";
  }

  // ============================================================================
  // updateMood
  // ============================================================================

  /**
   * 更新情绪型 AI 的心情值。
   *
   * @param {object} stateObj    - 完整游戏状态
   * @param {number} playerIndex - AI 玩家索引
   * @param {string} eventType   - 事件类型标签
   *   play_double, satisfy_double, open_other_train, draw_useful,
   *   draw_useless, own_train_blocked, others_play_on_mine,
   *   other_player_wins_round, ai_wins_round, hand_below_3
   * @returns {number} 更新后的 mood 值
   */
  function updateMood(stateObj, playerIndex, eventType) {
    var aiState = _getAIState(stateObj, playerIndex);
    var mood = aiState.mood;

    // Map message-context keys (from determineContext) to mood-delta keys
    var contextToDelta = {
      on_double:           play_double,
      on_satisfy_double:   satisfy_double,
      on_block_other:      open_other_train,
      on_draw_useful:      draw_useful,
      on_draw_useless:     draw_useless,
      on_blocked:          own_train_blocked,
      on_pass:             null,
      on_draw:             null,
      on_win_round:        ai_wins_round,
      on_lose_round:       other_player_wins_round,
      on_near_victory:     hand_below_3,
      on_good_play:        null
    };
    var deltaKey = contextToDelta[eventType];
    var delta = (deltaKey !== undefined && deltaKey !== null) ? (DominoConfig.MOOD_DELTAS[deltaKey] || 0) : (DominoConfig.MOOD_DELTAS[eventType] || 0);
    if (delta === undefined) {
      delta = 0;
    }

    // 应用增量
    mood += delta;

    // 限制到 [-1.0, 1.0]
    mood = _clamp(mood, -1.0, 1.0);

    // 惯性衰减（向 0 漂移）
    mood *= 0.9;

    // 持久化
    aiState.mood = mood;

    // 记录历史（保留最近 20 条）
    if (!aiState.moodHistory) {
      aiState.moodHistory = [];
    }
    aiState.moodHistory.push(mood);
    if (aiState.moodHistory.length > 20) {
      aiState.moodHistory.shift();
    }

    // 设置最后事件类型
    aiState.lastEventType = eventType;

    return mood;
  }

  // ============================================================================
  // getMoodEmoji
  // ============================================================================

  /**
   * 根据情绪值返回对应颜文字。
   * 委托 DominoConfig.getMoodEmoji 以保持一致性。
   *
   * @param {object} stateObj    - 完整游戏状态
   * @param {number} playerIndex - AI 玩家索引
   * @returns {string} 颜文字
   */
  function getMoodEmoji(stateObj, playerIndex) {
    var mood = _getMood(stateObj, playerIndex);
    return DominoConfig.getMoodEmoji(mood);
  }

  // ============================================================================
  // getThinkingDelay
  // ============================================================================

  /**
   * 获取 AI"思考"延迟（毫秒），模拟真人思考时间。
   *
   * @param {object} stateObj    - 完整游戏状态
   * @param {number} playerIndex - AI 玩家索引
   * @returns {number} 延迟毫秒数
   */
  function getThinkingDelay(stateObj, playerIndex) {
    var playerCfg = stateObj.players[playerIndex];
    var personalityId = playerCfg.personality;
    var cfg = DominoConfig.PERSONALITIES[personalityId];

    if (!cfg || !cfg.thinkDelay) {
      return 600; // 默认
    }

    var min = cfg.thinkDelay.min;
    var max = cfg.thinkDelay.max;

    // 情绪型：根据心情调整延迟
    if (personalityId === "emotional") {
      var mood = _getMood(stateObj, playerIndex);
      if (mood > 0.3) {
        // 心情好，反应快
        min *= 0.8;
        max *= 0.8;
      } else if (mood < -0.3) {
        // 心情差，犹豫
        min *= 1.2;
        max *= 1.2;
      }
    }

    return min + Math.random() * (max - min);
  }

  // ============================================================================
  // selectMoveWithReasoning（教练模式：返回最佳出牌 + 推理文本）
  // ============================================================================
  function selectMoveWithReasoning(stateObj, playerIndex) {
    var legalMoves = DominoEngine.getLegalMoves(stateObj, playerIndex);
    if (!legalMoves || legalMoves.length === 0) return null;

    var weights = getEffectiveWeights("coach", 0);

    var scored = [];
    for (var i = 0; i < legalMoves.length; i++) {
      var move = legalMoves[i];
      var baseScore = scoreMove(stateObj, playerIndex, move, weights);
      var score = baseScore * (0.95 + Math.random() * 0.1);
      scored.push({
        tileIndex: move.tileIndex, tile: move.tile,
        trainId: move.trainId, score: score
      });
    }

    scored.sort(function(a, b) { return b.score - a.score; });
    var best = scored[0];

    var tileStr = best.tile[0] + "|" + best.tile[1];
    var trainName = _getCoachTrainName(best.trainId, stateObj);
    var reasons = [];
    var hand = stateObj.players[playerIndex].hand;
    var remainingAfter = [];
    for (var j = 0; j < hand.length; j++) {
      if (j !== best.tileIndex) remainingAfter.push(hand[j]);
    }
    var pipsVal = DominoState.pips(best.tile);
    if (pipsVal >= 10) reasons.push("这张牌点数高(" + pipsVal + "点)，尽早出掉减少风险");
    if (best.trainId === ("p" + playerIndex)) reasons.push("出在自己火车上能保持控制");
    if (best.trainId === "mexican") reasons.push("墨西哥火车总是开放的，安全灵活");
    if (DominoState.isDouble(best.tile)) reasons.push("出双牌能获得额外回合");
    if (remainingAfter.length <= 2) reasons.push("手牌快出完了，优先清空");
    if (remainingAfter.length === 0) reasons.push("清空手牌就能赢下这轮");
    if (reasons.length === 0) reasons.push("综合评估所有选项后这一步得分最高");

    var reasoning = "我选择出[" + tileStr + "]在" + trainName + "，因为" + reasons.join("；") + "。";
    return {
      tileIndex: best.tileIndex, tile: best.tile, trainId: best.trainId,
      score: best.score, reasoning: reasoning
    };
  }

  function _getCoachTrainName(trainId, stateObj) {
    if (trainId === "mexican") return "墨西哥火车";
    var idx = _trainOwnerIndex(trainId);
    if (idx >= 0 && stateObj.players[idx]) return stateObj.players[idx].name + "的火车";
    return "火车";
  }

  // ============================================================================
  // generateTip（教练模式：对人类玩家的出牌给出建议）
  // ============================================================================
  function generateTip(stateObj, humanIndex) {
    var hand = stateObj.players[humanIndex].hand;
    var tips = [];
    if (hand && hand.length <= 3) tips.push("你手牌不多了，抓紧清空");
    if (hand && hand.length > 0) {
      for (var i = 0; i < hand.length; i++) {
        if (DominoState.pips(hand[i]) >= 10) {
          tips.push("你手上还有高点数的牌，建议尽早出掉减少扣分风险");
          break;
        }
      }
    }
    var mexTrain = null;
    var trains = stateObj.trains;
    for (var t = 0; t < trains.length; t++) {
      if (trains[t].id === "mexican") { mexTrain = trains[t]; break; }
    }
    if (mexTrain && hand && hand.length > 0) {
      for (var h = 0; h < hand.length; h++) {
        if (DominoState.matches(hand[h], mexTrain.openValue)) {
          tips.push("墨西哥火车现在可用，考虑出在那里更安全");
          break;
        }
      }
    }
    if (tips.length === 0) tips.push("出得不错，继续保持这个节奏");
    return tips[Math.floor(Math.random() * tips.length)];
  }

  // ============================================================================
  // 公开 API
  // ============================================================================
  return {
    selectMove: selectMove,
    scoreMove: scoreMove,
    getEffectiveWeights: getEffectiveWeights,
    selectMessage: selectMessage,
    determineContext: determineContext,
    updateMood: updateMood,
    getMoodEmoji: getMoodEmoji,
    getThinkingDelay: getThinkingDelay,
    selectMoveWithReasoning: selectMoveWithReasoning,
    generateTip: generateTip
  };

})();
</script>

  function injectCSS() {
    var styleEl = document.createElement("style");
    styleEl.textContent = CSS_TEXT;
    document.head.appendChild(styleEl);
  }

  var MAX_EVENT_LOG_ENTRIES = 50;

  // ============================================================================
  // 玩家颜色缓存 (从 Config 中提取)
  // ============================================================================
  function getPlayerColor(index) {
    var stateObj = getState();
    if (stateObj && stateObj.players && stateObj.players[index]) {
      return stateObj.players[index].color;
    }
    var players = DominoConfig.PLAYERS;
    if (players && players[index]) {
      return players[index].color;
    }
    return "#e0e0e0";
  }

  function getPlayerEmoji(index) {
    var stateObj = getState();
    if (stateObj && stateObj.players && stateObj.players[index]) {
      return stateObj.players[index].emoji;
    }
    var players = DominoConfig.PLAYERS;
    if (players && players[index]) {
      return players[index].emoji;
    }
    return "?";
  }

  function getPlayerName(index) {
    var stateObj = getState();
    if (stateObj && stateObj.players && stateObj.players[index]) {
      return stateObj.players[index].name;
    }
    var players = DominoConfig.PLAYERS;
    if (players && players[index]) {
      return players[index].name;
    }
    return "Player " + index;
  }

  function getPlayerPersonality(index) {
    var stateObj = getState();
    if (stateObj && stateObj.players && stateObj.players[index]) {
      return stateObj.players[index].personality;
    }
    var players = DominoConfig.PLAYERS;
    if (players && players[index]) {
      return players[index].personality;
    }
    return "human";
  }

    // 1. 注入 CSS

    // 3. 设置事件监听
    setupEventListeners();
    setupMenuListeners();

    // 4. 显示主菜单
    showMainMenu();
  }
